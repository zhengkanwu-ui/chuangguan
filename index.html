<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>面试闯关</title>
<style>
:root { --bg: #f3f2f8; --surface: #ffffff; --ink: #1c1a2e; --muted: #67637f; --line: #dedbea; --accent: #6246ea; --accent-deep: #4a30c9; --bad: #df4352; --on: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #12111b; --surface: #1c1a29; --ink: #eceaf7; --muted: #9f9bb9; --line: #2f2c44; --accent: #8b75ff; --accent-deep: #5e47d6; --bad: #ff6672; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
.box { width: 100%; max-width: 360px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 28px 20px 22px; display: grid; gap: 14px; text-align: center; }
.box[hidden] { display: none; }
h1 { margin: 0; font-size: 22px; }
p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
input { width: 100%; font-size: 16px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); text-align: center; letter-spacing: .06em; }
input:focus { outline: none; border-color: var(--accent); }
button { border: 0; border-radius: 14px; padding: 13px; font: inherit; font-weight: 800; font-size: 16px; background: var(--accent); color: var(--on); box-shadow: 0 4px 0 var(--accent-deep); cursor: pointer; }
button:disabled { opacity: .6; }
#msg { color: var(--bad); min-height: 1.6em; }
</style>
</head>
<body>
<form class="box" id="box" hidden autocomplete="off">
  <h1>面试闯关</h1>
  <p>输入密码打开</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="密码" required>
  <button id="go" type="submit">打开</button>
  <p id="msg" role="alert"></p>
  <p>输对一次，这台手机会记住，下次直接进。</p>
</form>
